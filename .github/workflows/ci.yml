name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check tracked files and history for credentials
        run: python scripts/check_no_secrets.py --history
      - name: Run tests
        run: python -m pytest -q
      - name: Check browser script syntax
        run: node --check web/app.js
